<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- ctrl + / -->
    <form action="sumit.html" method="get">
        <label for="username">User Name</label> <br>
        <!-- <input type="text" name="username" id="username" value="Aditya" disabled> -->
        <input type="text" name="username" id="username" placeholder="Enter User Name" minlength="2" maxlength="10" pattern="^[A-Za-z]{1,10}$" required>
        <br> <br>
        <label for="pNo">pNo</label> <br>
        <!-- <input type="text" name="username" id="username" value="Aditya" disabled> -->
        <input type="text" name="pNo" id="pNo" placeholder="Enter pNo" pattern="^[6-9]{1}[0-9]{9}$" required>
        <br> <br>
        <label for="password">Password</label><br>
        <input type="password" name="password" id="password">
        <br>
        <br>
        <label for="email">Email</label><br>
        <input type="email" name="email" id="email">
        <br>
        <br>
        <label for="age">Age</label><br>
        <input type="number" name="age" id="age" min="0" max="10">
        <br>
        <br>
        <label for="gender">Gender</label><br>
        <input type="radio" name="gender" id="male" checked value="male"> Male
        <input type="radio" name="gender" id="female" value="female"> Female
        <input type="radio" name="gender" id="other" value="other"> Other
        <br>
        <br>
        <label for="hobbies">Hobbies</label><br>
        <input type="checkbox" name="hobbies" id="reading" value="reading"> Reading
        <input type="checkbox" name="hobbies" id="sports" value="sports" checked> Sports
        <input type="checkbox" name="hobbies" id="music" value="music"> Music
        <br>
        <br>
        <label for="dob">Date of Birth</label><br>
        <input type="date" name="dob" min="2026-07-05" max="2026-07-28" id="dob">
        <br>
        <label for="resume">Upload Resume</label><br>
        <input type="file" name="resume" id="resume">
        <!-- yyyy-mm-dd -->
        <br>
        <br>
        <label for="country">Country</label><br>
        <select name="country" id="country">
            <option value="india">India</option>
            <option value="usa">USA</option>
            <option value="uk" selected>UK</option>
        </select>
        <br>
        <textarea name="message" id="message" cols="30" rows="10"></textarea>
        <br>
        <input type="submit" value="Add">
        <input type="reset" value="Reset">
        <input type="button" value="Click">
    </form>

</body>

</html>
