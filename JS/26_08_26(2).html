    <p id="demo2"></p>

    <script>
        function calcu(a, b, oper) {
            let value = 0;
            if (oper == "multi") {
                value = a * b;
            }
            if (oper == "add") {
                value = a + b;
            }

            return value;
        }
        let value = calcu(4, 5, 'multi');
        let value2 = calcu(4, 5, 'add');

        demo2.innerHTML = value
        demo3.innerHTML = value2
