<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <label for="num1">Num 1</label>
    <input type="text" id="num1" placeholder="Enter num1 ">
    <label for="num2">Num 2</label>
    <input type="text" id="num2" placeholder="Enter num2 ">
    <br>
    <br>
    <button id="action">Action</button>
    <!-- <button onclick="add()">Action</button> -->
    <p id="result">Result : 0</p>
    <script>
        const num1 = document.getElementById("num1")
        const num2 = document.getElementById("num2")
        const action = document.getElementById("action")
        const result = document.getElementById("result")
        action.addEventListener("click", function () {
            let sum = 0;
            sum = parseInt(num1.value) + parseInt(num2);
            result.innerHTML = "Result : " + sum;
        })

        // function add() {
        //     let sum = 0;
        //     sum = parseInt(num1.value) + parseInt(num2.value);
        //     result.innerHTML = "Result : " + sum;
        // }
        // action.addEventListener("click", add)
    </script>
</body>

</html>
