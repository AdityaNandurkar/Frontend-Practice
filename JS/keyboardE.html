<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <input id="inputV" type="text" placeholder="Type anything">
    <p id="demo"></p>
    <script>
        const inputV = document.getElementById("inputV");
        inputV.addEventListener("keyup", function (event) {
            document.getElementById("demo").innerHTML = "You Pressed " + event.key;
        })
    </script>

</body>

</html>
