<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <p id="demo"></p>

    <script>
        let text = prompt();
        for (let i = 1; i <= 10; i++) {
            text += "The Number is " + i + "<br>"
        }
        const num = document.getElementById("demo");
        num.innerHTML = text;

    </script>
</body>

</html>
