<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .abc {
            border-width: 5px;
            border-style: dotted;
            border-color: #dda794;

            border: 5px solid #d02020;
            /* border-radius: 20px; */
            /* border-radius: 20px 10px 5px 50px; */
            border-bottom-right-radius: 20px;
            border-top-left-radius: 10px;
        }

        .abc2 {
            border: 5px double #d02020;
        }

        .circle {
            height: 50px;
            width: 50px;
            border: 4px solid red;
            /* border-radius: 50%; */

            outline: 5px solid green;
        }
    </style>
</head>

<body>
    <h1 class="abc">This is my heading</h1>
    <h1 class="abc2">This is my heading</h1>
    <div class="circle"></div>
</body>

</html>
