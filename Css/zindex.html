<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .boxWrapper {
            border: 4px solid black;
            width: 50%;
            margin: auto;
        }

        .boxC {
            width: 100px;
            height: 100px;
            background-color: lightblue;
            border: 3px solid #ccc;
            margin-bottom: 10px;
            /* position: absolute; */
        }

        .box1 {
            z-index: 4;
        }

        .box2 {
            border: 3px solid red;
            background-color: lightgreen;
            z-index: 5;
            top: 50px;
            left: 50px;
        }

        .box3 {
            border: 3px solid blue;
            background-color: lightyellow;
            z-index: 9999999;
            top: 100px;
            left: 100px;
        }
        .centerDiv {
            height: 600px;
            width: 600px;
            border: 4px solid black;
            /* display: flex;
            justify-content: center;
            align-items: center; */

            display: grid;
            place-items: center;
        }

        .boxDiv {
            width: 100px;
            height: 100px;
            background-color: lightblue;
            /* margin: auto; */
        }
    </style>
</head>

<body>
    <div class="boxWrapper">
        <div class="boxC box1">Box 1</div>
        <div class="boxC box2">Box 2</div>
        <div class="boxC box3">Box 3</div>
    </div>

    <h1 style="text-align: center;">This is heading</h1>

    <img style="display: block; margin: auto; border: 4px solid black;" src="../images/img_flowers.jpg" alt="Flowers">


    <div class="centerDiv">
        <div class="boxDiv"></div>
    </div>
</body>

</html>
